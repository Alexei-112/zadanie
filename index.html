</head>

let i = 0;
let selected = null;
let revealed = false;

function shuffle(arr) {
  for (let k = arr.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [arr[k], arr[j]] = [arr[j], arr[k]];
  }
  return arr;
}

function render() {
  const item = data[i];
  selected = null;
  revealed = false;

  document.getElementById("progress").textContent = "Питання " + (i + 1) + " з " + data.length;
  document.getElementById("num").textContent = "№" + item.n;
  document.getElementById("question").textContent = item.q;

  const correct = item.a;
  const pool = data.map(x => x.a).filter(a => a !== correct);
  const uniq = [...new Set(pool)];
  const distractors = shuffle(uniq).slice(0, 3);
  const options = shuffle([correct, ...distractors]);

  const box = document.getElementById("options");
  box.innerHTML = "";
  options.forEach(text => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = text;
    btn.dataset.correct = (text === correct) ? "1" : "0";
    btn.onclick = () => {
      if (revealed) return;
      [...box.children].forEach(c => c.classList.remove("selected"));
      btn.classList.add("selected");
      selected = btn;
      document.getElementById("showBtn").disabled = false;
    };
    box.appendChild(btn);
  });

  const showBtn = document.getElementById("showBtn");
  showBtn.disabled = true;
  showBtn.textContent = "Показати відповідь";
}

document.getElementById("showBtn").onclick = function () {
  if (revealed || !selected) return;
  revealed = true;
  [...document.getElementById("options").children].forEach(c => {
    c.classList.remove("selected");
    if (c.dataset.correct === "1") c.classList.add("correct");
    else if (c === selected) c.classList.add("wrong");
    c.disabled = true;
  });
  this.disabled = true;
};

document.getElementById("nextBtn").onclick = function () {
  if (i < data.length - 1) { i++; render(); }
};

document.getElementById("prevBtn").onclick = function () {
  if (i > 0) { i--; render(); }
};

render();
</script>
