<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест: ортопедична стоматологія</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#dcdcd5;--ok:#1e9e4a;--okb:#e3f6e9;--no:#d93025;--nob:#fdeaea;--ac:#2f5bd8}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#ececea;--mut:#9a9a94;--bd:#3a3a37;--okb:#12341d;--nob:#3b1a18}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
.w{max-width:680px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
h2{font-size:18px;margin:0 0 14px;font-weight:600}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.no{background:var(--nob);border-color:var(--no);color:var(--no);font-weight:600}
.btn{font:inherit;border:0;border-radius:10px;padding:11px 18px;background:var(--ac);color:#fff;cursor:pointer;margin-top:10px}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.big{font-size:40px;font-weight:700;margin:6px 0}
</style></head><body><div class="w" id="app"></div>
<script>
const DATA=[{"q": "Якою у порівнянні з поряд розміщеними зубами має бути ширина оклюзійного валика під час виготовлення часткового знімного пластинкового протеза?", "a": "Більшою на 1-2 мм", "w": ["Більшою на 3-4 мм", "Меншою на 1-2 мм", "Меншою на 3-4 мм", "Більшою на 5-6 мм"]}, {"q": "У якому разі багатоланковий кламер застосовується як дуга бюгельного протеза на нижню щелепу?", "a": "Малого простору між дном ротової порожнини та ясенним краєм", "w": ["Значного нахилу альвеолярного відростка вперед", "Глибокого дна ротової порожнини", "Значної двосторонньої конвергенції бічних зубів", "Глибокого прикусу"]}, {"q": "У пацієнта віком 45 років спостерігається двосторонній кінцевий дефект зубного ряду на верхній щелепі, обмежений іклами. Пацієнту заплановано виготовити бюгельний протез. До якого виду протезів він належить?", "a": "Частковий знімний", "w": ["Умовно знімний", "Повний знімний", "Частковий знімний пластинковий", "Незнімний"]}, {"q": "Укажіть, у яких випадках зубний технік виготовляє розбірний незнімний мостоподібний протез.", "a": "Опорні зуби або одна з опор значно нахилені один до одного в бік дефекту", "w": ["Подовження зубо-альвеолярного відростка в ділянці відсутніх зубів із протилежної щелепи", "Патологічна стертість природних зубів із завищенням висоти центральної оклюзії", "Патологічна стертість природних зубів із заниженням висоти центральної оклюзії.", "Опорні зуби мають паралельність"]}, {"q": "Від металевої вкладки пацієнт відмовився. Із якого іншого матеріалу зубний технік може виготовити вкладку?", "a": "Пластмаси, фарфору", "w": ["Амальгами, мелоту", "Цементу, гіпсу", "Пластмаси, воску", "Фарфору, гіпсу"]}, {"q": "Через що передається сила дії функціонально-направляючих ортодонтичних апаратів?", "a": "Елементи пасивної дії", "w": ["Елементи активної дії", "Скорочення м’язів", "Елементи міодинамічної рівноваги", "Елементи активної та пасивної дії"]}, {"q": "Пацієнту з переломом беззубої нижньої щелепи виготовляють шину Порта. Із якого матеріалу виготовляється шина?", "a": "Пластмаси гарячої полімеризації", "w": ["Облицювальної пластмаси", "Сплаву металів", "Керамічної маси", "Пластмаси холодної полімеризації"]}, {"q": "Які компоненти є основними в стоматологічних фарфорових масах?", "a": "Каолін, кварц, польовий шпат", "w": ["Каолін, тальк, боратне скло", "Каолін, кварц, гіпс", "Каолін, кварц, апатит", "Каолін, гіпс, корунд"]}, {"q": "До якого ускладнення може призвести помилка під час лікування карієсу - відсутність контактного пункту?", "a": "Папіліту", "w": ["Верхівкового періодонтиту", "Випадіння пломби", "Зміни кольору пломби", "Вторинного карієсу"]}, {"q": "Яка пластмаса використовується для виготовлення базисів знімних протезів?", "a": "Фторакс", "w": ["Протакрил", "Стомафлекс", "Сієласт", "Синма-М"]}, {"q": "Під час використання пацієнтом знімного пластинкового протеза відбувся лінійний перелом базису протеза в ділянці піднебіння. З естетичних міркувань вирішено провести лагодження протеза із використанням базисної пластмаси. Що є обов’язковою умовою техніки лагодження знімного протеза в цьому разі?", "a": "Гіпсування в кювету прямим методом", "w": ["Гіпсування в артикулятор", "Гіпсування в кювету зворотним методом", "Гіпсування в оклюдатор", "Гіпсування в кювету комбінованим способом"]}, {"q": "Укажіть умови для застосування замкових кріплень.", "a": "Достатня висота клінічної коронки опорного зуба", "w": ["Значний нахил опорного зуба у вестибулярний бік", "Низька коронка опорного зуба", "Значний нахил опорного зуба в оральний бік", "Значний нахил опорного зуба у бік дефекту"]}, {"q": "Якою, згідно із санітарно- гігієнічними нормативами, має бути мінімальна площа стоматологічного кабінету для встановлення однієї стоматологічної установки?", "a": "14 м2", "w": ["10 м2", "22 м2", "20 м2", "5 м2"]}, {"q": "Укажіть, у якій площині відображаються аномалії прикусу за класифікацією Енгля.", "a": "Сагітальній", "w": ["Діагональній", "Вертикальній", "Оклюзій ній", "Трансверзальній"]}, {"q": "Яка має бути ширина дуги у конструкції бюгельного протеза на верхню щелепу?", "a": "5-10 мм", "w": ["15-18 мм", "20 мм і більше", "3-4 мм", "1-2 мм"]}, {"q": "Чим заповнюють штамповану коронку з отвором, виготовлену за методом Бєлкіна, під час припасування її на куксі зуба?", "a": "Воском", "w": ["Відбитковою масою", "Цементом", "Мольдином", "Гіпсом"]}, {"q": "Зміщення якого уламка при двобічному ментальному переломі може спричинити асфіксію у потерпілого?", "a": "Середнього", "w": ["Малого", "Великого", "Бічних", "Немає вірної відповіді"]}, {"q": "У пацієнта віком 35 років свіжий ментальний перелом нижньої щелепи без видимого зміщення уламків. Застосування якого ортопедичного апарата показано в цьому разі?", "a": "Фіксувального", "w": ["Репонувального", "Заміщувального", "Формувального", "Комбінованого"]}, {"q": "Назвіть складові замкових кріплень бюгельного протеза.", "a": "Патриця і матриця", "w": ["Матриця і кнопка", "Патриця і кнопка", "Кламер, патриця, матриця", "Патриця і телескоп"]}, {"q": "У пацієнта віком 45 років — двосторонній кінцевий дефект зубного ряду на верхній щелепі, обмежений іклами. Йому заплановано виготовити бюгельний протез. За допомогою чого під час паралелометрії визначають глибину ретенційної зони?", "a": "Калібрів", "w": ["Скальпелів", "Графітових стрижнів", "Діагностичних стрижнів", "Шпателів"]}, {"q": "Яку модель необхідно вилити під час виготовлення сучасних незнімних ортопедичних конструкцій?", "a": "Комбіновану, розбірну", "w": ["Цементну", "Допоміжну", "Комбіновану", "Просту анатомічну"]}, {"q": "Виберіть апарат, за допомогою якого проводиться комбінована штамповка.", "a": "Бромштром", "w": ["Самсон", "Шарп", "Немає вірної відповіді", "Паркер"]}, {"q": "Установіть причину спікання опакових та дентинних мас у вакуумі.", "a": "Для зменшення пористості маси", "w": ["Для зменшення усадки маси", "Для кращого з’єднання маси з металом", "Для кращого з’єднання шарів маси", "Немає вірної відповіді"]}, {"q": "За клінічними показаннями зубному техніку треба виготовити тимчасові коронки. Який матеріал він використає?", "a": "Пластмасу", "w": ["Фольгу", "Віск", "Гіпс", "Силікон"]}, {"q": "Яке буде навантаження на опорні зуби під час зменшення площі оклюзійної поверхні проміжної частини мостоподібного протеза?", "a": "Зменшене", "w": ["Зростає поступово", "Не змінюється", "Збільшене", "Рівномірне"]}, {"q": "Який прикус характеризується висуванням нижньої щелепи вперед?", "a": "Прогенія", "w": ["Глибокий", "Прогнатія", "Відкритий", "Прямий"]}, {"q": "Для зняття якого відбитка виготовляється індивідуальна ложка?", "a": "Функціонального", "w": ["Анатомічного", "Робочого", "Допоміжного", "Часткового"]}, {"q": "Як називається сполучення двох або кількох металів, при якому утворюється однорідна речовина, що має нові властивості, не притаманні жодному з компонентів?", "a": "Сплав", "w": ["Композиція", "Полімер", "Елемент", "Сполука"]}, {"q": "Яка основна вимога до дезінфікуючих засобів під час знезараження відбитків в ортопедичній стоматології?", "a": "Бути сумісними з гіпсом та не впливати на форму відбитків", "w": ["Доступність у ціні та легкість у використанні", "Зручність, швидкість та ефективність у застосуванні", "Мала ємність, нетоксичні", "Відсутність токсичної дії на організм лікаря та зубного техніка"]}, {"q": "Назвіть складові частини мостоподібного протеза.", "a": "Опорні елементи і проміжна частина", "w": ["Оклюзійна накладка і проміжна частина", "Опорні елементи і оклюзійна накладка", "Опорні елементи і базис", "Проміжна частина і кламери"]}, {"q": "Що використовують на етапах виготовлення незнімних ортопедичних конструкцій для розплавлення воску?", "a": "Воскотопку", "w": ["Тример", "Полімеризатор", "Сухожарову шафу", "Вакуумний міксер"]}, {"q": "Яким чином край штучної коронки має охоплювати шийку природного зуба?", "a": "Щільно", "w": ["Не повинен охоплювати шийку зуба, мати зазор до 1 мм", "З одного боку", "Не повинен охоплювати шийку зуба, мати зазор до 2 мм", "Довільно"]}, {"q": "Під час виготовлення мост Що визначає позначена на восковому валику «лінія усмішки»?", "a": "Рівень шийок фронтальних зубів", "w": ["Відстань між іклами верхньої щелепи", "Рівень розслаблення м’язів", "Розмір нижньої третини обличчя", "Відстань, на яку розмикаються зубні ряди"]}, {"q": "Який механізм з’єднання пластмаси зі сплавом?", "a": "Механічного зчеплення", "w": ["Хімічної реакції", "Міжмолекулярного притягання", "Функціонального присмоктування", "Фізичної адгезії"]}, {"q": "Який кламер має розщеплені Т-подібні плечі?", "a": "Роуча", "w": ["Бонвіля", "Аккера", "Джексона", "Березовського"]}, {"q": "Які недоліки мають металокерамічні конструкції?", "a": "Значне препарування зубів, можливе стирання зубів-антагоністів", "w": ["Алергічні реакції на матеріали протеза, складність виготовлення", "Незначне препарування зубів, легко знімаються", "Недостатня естетичність конструкції, необхідність виготовлення розбірної моделі", "Нещільне прилягання до кукси зуба, необхідність препарування зубів"]}, {"q": "У якій послідовності зубний технік зобов’язаний наносити шари керамічної маси?", "a": "Опаковий, дентинний, емалевий", "w": ["Дентинний, опаковий, емалевий", "Опаковий, емалевий, дентинний", "Дентинний,емалевий, опаковий", "Емалевий, опаковий, дентин ний"]}, {"q": "Під час перевірки конструкції повних знімних протезів у клініці виявлено, що в пацієнта зменшена нижня третина обличчя та надмірно виражені носо-губні складки. Якої помилки припустилися під час виготовлення протеза?", "a": "Неправильно визначена міжальвеолярна висота", "w": ["Неправильно визначена центральна оклюзія", "Помилка під час гіпсування моделей в оклюдатор", "Помилка під час конструювання штучного зубного ряду", "Помилка під час виготовлення прикусних шаблонів"]}];
const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[^a-zа-яіїєґ0-9 ]/g,'').trim();
const grams=s=>{s=' '+norm(s)+' ';const m=new Map();for(let i=0;i<s.length-2;i++){const g=s.slice(i,i+3);m.set(g,(m.get(g)||0)+1)}return m};
const dice=(a,b)=>{let x=0,ta=0,tb=0;for(const v of a.values())ta+=v;for(const v of b.values())tb+=v;for(const[g,v]of a)if(b.has(g))x+=Math.min(v,b.get(g));return 2*x/(ta+tb||1)};
const POOL=[...new Set(DATA.flatMap(d=>[d.a,...d.w.filter(x=>!/^Немає вірної/i.test(x))]))].map(t=>({t,g:grams(t)}));
function distractors(q,n){
  const ga=grams(q.a),na=norm(q.a),own=new Set(q.w.map(norm));
  const cand=new Map();
  for(const o of POOL){
    const k=norm(o.t);
    if(k===na||/^немає вірної/.test(k))continue;
    let s=dice(ga,o.g);
    if(own.has(k))s+=0.25;
    if(s<0.45&&!own.has(k))continue;
    cand.set(k,{t:o.t,s:s+Math.random()*0.15});
  }
  let list=[...cand.values()].sort((a,b)=>b.s-a.s).map(x=>x.t);
  if(list.length<n){const extra=shuf(q.w.filter(x=>!list.includes(x)&&!/^Немає вірної/i.test(x)));list=list.concat(extra)}
  return list.slice(0,n);
}
let st;
function menu(){
  $('#app').innerHTML=`<div class="card"><h2>Тест · ${DATA.length} питань</h2>
  <p style="color:var(--mut)">Після кліку одразу видно результат: правильна відповідь — зелена, твоя помилка — червона.</p>
  <div class="row"><label>Варіантів відповіді: <select id="n"><option value="4">4</option><option value="3">3</option></select></label>
  <label>Порядок: <select id="m"><option value="r">Випадковий</option><option value="o">По порядку</option></select></label>
  <label>Відповіді: <select id="s"><option value="1">Схожі між собою</option><option value="0">З PDF</option></select></label></div>
  <button class="btn" id="go">Почати</button></div>`;
  $('#go').onclick=()=>start(+$('#n').value,$('#m').value==='r',$('#s').value==='1');
}
function start(n,rnd,sim){
  const qs=(rnd?shuf(DATA):DATA.slice());
  st={n,qs,i:0,score:0,wrong:[],sim};show();
}
function show(){
  if(st.i>=st.qs.length)return end();
  const q=st.qs[st.i];
  const wr=st.sim?distractors(q,st.n-1):shuf(q.w.filter(x=>!/^Немає вірної/i.test(x))).slice(0,st.n-1);
  const opts=shuf([q.a,...wr]);
  $('#app').innerHTML=`<div class="top"><span>Питання ${st.i+1} / ${st.qs.length}</span><span>✓ ${st.score}</span></div>
  <div class="bar"><i style="width:${st.i/st.qs.length*100}%"></i></div>
  <div class="card"><h2></h2><div id="o"></div><div id="sw"><button class="btn s" id="sh">Показати відповідь</button></div><div id="nx"></div></div>`;
  $('h2').textContent=q.q;
  let done=false;
  const next=()=>{$('#sw').innerHTML='';$('#nx').innerHTML=`<button class="btn">${st.i+1<st.qs.length?'Далі →':'Результат'}</button>`;$('#nx button').onclick=()=>{st.i++;show()};$('#nx button').focus()};
  $('#sh').onclick=()=>{if(done)return;done=true;[...document.querySelectorAll('.opt')].forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});st.wrong.push(q);next()};
  opts.forEach(t=>{
    const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=()=>{
      if(done)return;done=true;
      [...document.querySelectorAll('.opt')].forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok')});
      if(t===q.a)st.score++;else{b.classList.add('no');st.wrong.push(q)}
      $('.top span:last-child').textContent='✓ '+st.score;
      next();
    };
    $('#o').appendChild(b);
  });
}
function end(){
  const p=Math.round(st.score/st.qs.length*100);
  $('#app').innerHTML=`<div class="card"><h2>Готово</h2><div class="big">${st.score} / ${st.qs.length} · ${p}%</div>
  <div class="row"><button class="btn" id="a">Ще раз</button>${st.wrong.length?'<button class="btn s" id="w">Повторити помилки ('+st.wrong.length+')</button>':''}</div></div>`;
  $('#a').onclick=menu;
  if(st.wrong.length)$('#w').onclick=()=>{const{n,sim}=st;st={n,sim,qs:shuf(st.wrong),i:0,score:0,wrong:[]};show()};
}
menu();
</script></body></html>
